<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&P Shoes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/crear.js"></script>
</head>

<body>
    <header>
        <nav>
            <img src="img/logo.png" alt="logo-negro-A&P">
            <ul class="menu-nav">
                <a href="index.html">
                    <li>Ver</li>
                </a>
                <a href="consultar.html">
                    <li>Consultar id</li>
                </a>
                <a href="crear.html">
                    <li>Crear</li>
                </a>
                <a href="modificar.html">
                    <li>Modificar</li>
                </a>
                <a href="eliminar.html">
                    <li>Eliminar</li>
                </a>
            </ul>
        </nav>
    </header>

    <main>
        <hr>
        <h1>Crear producto</h1>

        <form id="altaProducts-form" class="products-form-amplio">

            <div class="formInput">
                <label for="nameProd">Nombre:</label>
                <input type="text" name="nombre" id="nameProd" required>
            </div>

            <div class="formInput">
                <label for="imageProd">Imagen:</label>
                <input type="text" name="img_url" id="imageProd" required>
            </div>

            <div class="formInput">
                <label for="categoryProd">Categoria:</label>
                <select name="categoria" id="categoryProd" required>
                    <option value="VANS">VANS</option>
                    <option value="CAMPUS">CAMPUS</option>
                </select>
            </div>

            <div class="formInput">
                <label for="priceProd">Precio:</label>
                <input type="number" name="precio" id="priceProd" required>
            </div>

            <input type="submit" value="Crear producto" class="boton-submit">

        </form>

        <hr>
        <div id="contenedor-productos"></div>
    </main>

    <footer>
        <span>A&P Shoes</span>
    </footer>
</body>
</html>
